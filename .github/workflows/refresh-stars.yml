name: Refresh GitHub Stars

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/refresh-stars.yml
      - scripts/github_stars.py
      - data/projects.yaml
      - data/awesome-lists.yaml

permissions:
  contents: write

concurrency:
  group: github-stars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Zhao-Tian-yi/awesome-jev' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Ensure the canonical generator uses the star snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate_readme.py')
          text = path.read_text(encoding='utf-8')
          hook = 'from github_stars import annotate_readme, load_snapshot\n'
          old = 'path:render_readme(lang,data,papers,lists)'
          new = 'path:annotate_readme(render_readme(lang,data,papers,lists),lang,load_snapshot(root))'
          if hook not in text:
              assert text.count('import yaml\n') == 1 and text.count(old) == 1, 'Generator changed; review the integration before editing.'
              text = text.replace('import yaml\n', 'import yaml\n' + hook, 1).replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          else:
              assert new in text, 'Partial star integration; manual review required.'
          PY
      - name: Read repository star counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_stars.py --refresh
      - name: Generate and validate all three languages
        run: |
          python scripts/github_stars.py --self-test
          python scripts/generate_readme.py
          python scripts/validate.py
          python scripts/generate_readme.py --check
          git diff --check
      - name: Commit the snapshot and generated pages
        run: |
          git add data/github-stars.json scripts/generate_readme.py README.md README.zh-CN.md README.ja.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add GitHub Stars columns and intensive-update notices across three languages'
          git push origin HEAD:master
