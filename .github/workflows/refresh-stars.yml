name: Refresh GitHub Stars

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/refresh-stars.yml
      - scripts/generate_readme.py
      - scripts/github_stars.py
      - scripts/test_presentation.py
      - data/projects.yaml
      - data/awesome-lists.yaml
      - data/papers.yaml
      - data/updates.yaml

permissions:
  contents: write

concurrency:
  group: github-stars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Zhao-Tian-yi/awesome-jev' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Test rendering before refreshing metadata
        run: |
          python scripts/github_stars.py --self-test
          python scripts/test_presentation.py
      - name: Read repository star counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_stars.py --refresh
      - name: Generate and validate all three languages
        run: |
          python scripts/generate_readme.py
          python scripts/validate.py
          python scripts/generate_readme.py --check
          python scripts/test_presentation.py
          git diff --check
      - name: Commit generated files
        run: |
          git add data/github-stars.json README.md README.zh-CN.md README.ja.md docs/evidence.md docs/comparison.md docs/updates.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh star snapshot and regenerate research map'
          git push origin "HEAD:${GITHUB_REF_NAME}"
