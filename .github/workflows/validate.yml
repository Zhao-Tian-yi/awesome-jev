# SPDX-License-Identifier: MIT
name: Validate research map
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      check_links:
        description: Also check external HTTPS links
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install data parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Validate metadata, dates, links within repo, and language parity
        run: python3 scripts/validate.py
      - name: Ensure generated pages are current
        run: python3 scripts/generate_readme.py --check
      - name: Check external links
        if: github.event_name == 'workflow_dispatch' && inputs.check_links
        run: python3 scripts/validate.py --links
