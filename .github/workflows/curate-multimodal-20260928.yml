name: Apply reviewed multimodal research update
on:
  push:
    branches: [multimodal-research-20260928]
    paths:
      - scripts/_apply_multimodal_20260928.py
      - .github/workflows/curate-multimodal-20260928.yml
permissions:
  contents: write
concurrency:
  group: curate-multimodal-20260928
  cancel-in-progress: false
jobs:
  curate:
    if: github.repository == 'Zhao-Tian-yi/awesome-jev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multimodal-research-20260928
      - name: Install parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Prepare one-time migration and validation block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_apply_multimodal_20260928.py')
          text = path.read_text()
          old = "rl_status='One supervised CE objective; no RLCD in the documented recipe')))"
          new = "rl_status='One supervised CE objective; no RLCD in the documented recipe'))"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          path = Path('.github/workflows/validate.yml')
          text = path.read_text()
          old = '        run: python3 scripts/test_presentation.py'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '        run: |\n          python3 scripts/test_presentation.py', 1))
          PY
      - name: Apply reviewed records and renderer changes
        run: |
          python -m py_compile scripts/_apply_multimodal_20260928.py scripts/multimodal_catalog.py scripts/test_multimodal.py
          python scripts/_apply_multimodal_20260928.py
      - name: Refresh actual GitHub star snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_stars.py --refresh
      - name: Generate and verify
        run: |
          python scripts/generate_readme.py
          python scripts/validate.py
          python scripts/generate_readme.py --check
          python scripts/test_presentation.py
          python scripts/test_multimodal.py
          python scripts/github_stars.py --self-test
          git diff --check
      - name: Commit verified canonical data and documents
        run: |
          git add data/projects.yaml data/papers.yaml data/updates.yaml data/github-stars.json
          git add README.md README.zh-CN.md README.ja.md docs scripts/generate_readme.py CONTRIBUTING.md
          git add .github/workflows/refresh-stars.yml .github/workflows/validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add multimodal model records, evidence, reading routes and recent papers'
          git push origin HEAD:multimodal-research-20260928
